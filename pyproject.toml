[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caveman"
version = "0.2.0"
description = "Caveman: type what you want, Caveman builds it. Durable, verified multi-agent software delivery."
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.22.3,<0.23",
  "pydantic>=2",
  "python-dotenv>=1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
caveman = "caveman.cli:main"
# Compatibility entrypoint for the orchestration core's operator CLI.
walter = "walter.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: opt-in credit-bearing provider smoke test"]
