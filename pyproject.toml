[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caveman"
version = "0.2.0"
description = "Caveman: type what you want, Caveman builds it. Durable, verified multi-agent software delivery."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agents", "llm", "orchestration", "code-generation", "sandbox", "multi-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "openai-agents>=0.22.3,<0.23",
  "pydantic>=2",
  "python-dotenv>=1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  # PostgreSQL for multi-host deployments (CAVEMAN_DATABASE_URL); SQLite otherwise.
  "psycopg[binary]>=3.2,<4",
  # Trusted validation runs pytest inside the sandbox from this environment.
  "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/michael-muh-freakin-mercer/caveman"
Documentation = "https://github.com/michael-muh-freakin-mercer/caveman/blob/main/docs/ENGINE.md"
Changelog = "https://github.com/michael-muh-freakin-mercer/caveman/blob/main/CHANGELOG.md"
Issues = "https://github.com/michael-muh-freakin-mercer/caveman/issues"

[project.scripts]
caveman = "caveman.cli:main"
# Compatibility entrypoint for the orchestration core's operator CLI.
walter = "walter.cli:main"

[project.optional-dependencies]
test = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: opt-in credit-bearing provider smoke test"]
