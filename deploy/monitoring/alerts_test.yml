# promtool test rules deploy/monitoring/alerts_test.yml
rule_files:
- alerts.yml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: cavman_queue_oldest_seconds{job="cavman"}
    values: 0 0 700x10
  - series: cavman_deliveries{job="cavman",status="failed"}
    values: 0x5 1x10
  - series: cavman_jobs{job="cavman",status="failed",outcome="error"}
    values: 0+1x70
  - series: cavman_spend_month_usd{job="cavman"}
    values: 90 95 120
  alert_rule_test:
  - eval_time: 3m
    alertname: CavmanQueueBacklog
    exp_alerts: []
  - eval_time: 9m
    alertname: CavmanQueueBacklog
    exp_alerts:
    - exp_labels:
        severity: warning
        job: cavman
      exp_annotations:
        summary: A build has waited over 10 minutes for a worker.
        description: The oldest queued job is 11m 40s old. Workers may be down, stuck, or too few.
        runbook: docs/RUNBOOK.md#worker-outage
  # The failed series is exported at 0, so the first-ever failure fires.
  - eval_time: 4m
    alertname: CavmanDeliveryFailures
    exp_alerts: []
  - eval_time: 7m
    alertname: CavmanDeliveryFailures
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: A finished build failed to package its delivery.
        description: Users see a completed build they cannot download. Check the API and disk space on the data volume.
        runbook: docs/RUNBOOK.md#maintenance
  - eval_time: 70m
    alertname: CavmanJobFailures
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: More than 5 build jobs failed in the last hour.
        description: Check `cavman ops list --attention` and recent worker logs for a common cause.
        runbook: docs/RUNBOOK.md#stuck-runs
  - eval_time: 2m
    alertname: CavmanSpendHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        job: cavman
      exp_annotations:
        summary: Model spend this month is over $100.
        description: Provider-reported spend is $120.00 this month across all accounts.
        runbook: docs/RUNBOOK.md#limits
