# Local/self-hosted topology: private API, one or more workers, and the web app.
# Not a production deployment by itself: put the web app behind TLS, keep the
# API on a private network, and use managed Postgres for auth (AUTH_DATABASE_URL).
services:
  api:
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    env_file: ../.env
    environment:
      CAVEMAN_DATA_DIR: /data
    volumes: [caveman-data:/data]
    # No published port: only the web service reaches the API.
    expose: ["8000"]
    command: ["caveman", "api", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    env_file: ../.env
    environment:
      CAVEMAN_DATA_DIR: /data
    volumes: [caveman-data:/data]
    command: ["caveman", "worker"]
    # Bubblewrap needs to create user namespaces and mount /proc inside this
    # container. Docker's default seccomp profile, its AppArmor profile and the
    # masked /proc prevent that. seccomp-worker.json is Docker's default plus
    # the six system calls Bubblewrap needs for a user namespace (see
    # scripts/worker_seccomp.py), so the rest of the default filter still
    # applies. AppArmor and the masked paths have no narrower setting that
    # works. Caveman's own sandbox still applies namespaces, a network-deny
    # seccomp filter and resource limits to every candidate command. A VM or
    # CAVEMAN_SANDBOX_BACKEND=e2b needs none of this.
    security_opt:
      - seccomp=seccomp-worker.json
      - apparmor=unconfined
      - systempaths=unconfined

  web:
    build: { context: ../web, dockerfile: ../deploy/web.Dockerfile }
    env_file: ../web/.env.local
    environment:
      CAVEMAN_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  caveman-data:
