# End-to-end check of the compose topology on PostgreSQL, used by CI and
# `deploy/e2e.sh`. Layered on compose.yaml; never use it for a real deployment:
# it runs the scripted test executor and disables auth rate limiting.
#
# Differences from compose.yaml: a Postgres service holds auth and operational
# state, two workers share the job queue (the multi-host path), the web app is
# published on port 3100, and emails go to a host directory the tests read.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: caveman
      POSTGRES_PASSWORD: caveman
      POSTGRES_DB: caveman
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "caveman"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    env_file: !reset []
    environment: &backend
      CAVEMAN_DATA_DIR: /data
      CAVEMAN_API_TOKEN: e2e-service-token-0123456789abcdef0123456789
      CAVEMAN_DATABASE_URL: postgresql://caveman:caveman@postgres:5432/caveman
      CAVEMAN_EXECUTOR: scripted
      CAVEMAN_ENV: development
      CAVEMAN_SCRIPTED_STEP_DELAY: "0.15"
      CAVEMAN_HEARTBEAT_SECONDS: "0.5"
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    env_file: !reset []
    environment: *backend
    deploy: { replicas: 2 }
    depends_on:
      postgres: { condition: service_healthy }

  web:
    env_file: !reset []
    environment:
      CAVEMAN_API_URL: http://api:8000
      CAVEMAN_API_TOKEN: e2e-service-token-0123456789abcdef0123456789
      BETTER_AUTH_SECRET: e2e-auth-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://localhost:3100
      AUTH_DATABASE_URL: postgresql://caveman:caveman@postgres:5432/caveman
      CAVEMAN_DEV_OUTBOX: /outbox/outbox.jsonl
      CAVEMAN_E2E: "1"
    volumes: ["${CAVEMAN_E2E_DIR:?set CAVEMAN_E2E_DIR}:/outbox"]
    ports: !override ["3100:3000"]
    depends_on:
      postgres: { condition: service_healthy }
