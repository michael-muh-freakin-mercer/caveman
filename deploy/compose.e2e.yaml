# End-to-end check of the compose topology on PostgreSQL, used by CI and
# `deploy/e2e.sh`. Layered on compose.yaml; never use it for a real deployment:
# it runs the scripted test executor and disables auth rate limiting.
#
# Differences from compose.yaml: a Postgres service holds auth and operational
# state, two workers share the job queue (the multi-host path), the web app is
# published on port 3100, and emails go to a host directory the tests read.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cavman
      POSTGRES_PASSWORD: cavman
      POSTGRES_DB: cavman
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cavman"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    env_file: !reset []
    environment: &backend
      CAVMAN_DATA_DIR: /data
      CAVMAN_API_TOKEN: e2e-service-token-0123456789abcdef0123456789
      CAVMAN_DATABASE_URL: postgresql://cavman:cavman@postgres:5432/cavman
      CAVMAN_EXECUTOR: scripted
      CAVMAN_ENV: development
      CAVMAN_SCRIPTED_STEP_DELAY: "0.15"
      CAVMAN_HEARTBEAT_SECONDS: "0.5"
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    env_file: !reset []
    environment: *backend
    deploy: { replicas: 2 }
    depends_on:
      postgres: { condition: service_healthy }

  web:
    env_file: !reset []
    environment:
      CAVMAN_API_URL: http://api:8000
      CAVMAN_API_TOKEN: e2e-service-token-0123456789abcdef0123456789
      BETTER_AUTH_SECRET: e2e-auth-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://localhost:3100
      AUTH_DATABASE_URL: postgresql://cavman:cavman@postgres:5432/cavman
      CAVMAN_DEV_OUTBOX: /outbox/outbox.jsonl
      CAVMAN_E2E: "1"
    volumes: ["${CAVMAN_E2E_DIR:?set CAVMAN_E2E_DIR}:/outbox"]
    ports: !override ["3100:3000"]
    depends_on:
      postgres: { condition: service_healthy }
