# Single-server production overlay (DigitalOcean guide: docs/DEPLOY_DIGITALOCEAN.md).
#
#   docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.prod.yaml up -d --build
#
# (run from the repository root; --env-file makes the root .env, which holds
# CAVEMAN_DOMAIN, the interpolation source regardless of Compose version)
#
# - Caddy terminates TLS for CAVEMAN_DOMAIN and is the only thing listening on
#   the internet; the web app and API stay on the private compose network.
# - Workers run candidate code in E2B microVMs (CAVEMAN_SANDBOX_BACKEND=e2b in
#   .env), so they need no relaxed container security options.
# - Project repositories and delivery archives live on the attached block
#   storage volume mounted at /mnt/caveman-data; run and account state lives in
#   managed PostgreSQL (CAVEMAN_DATABASE_URL and AUTH_DATABASE_URL).
#   deploy/postgres-ca.crt is the managed database's CA certificate; the
#   connection strings verify the server against it (sslmode=verify-full).
# Container logs are rotated by size (5 x 10 MB per service), so old entries
# are deleted rather than kept indefinitely (see the privacy policy). Each line
# carries its compose service name, which is how the optional log shipper
# (the alloy service below) tells Caveman's containers from anything else.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5", labels: "com.docker.compose.service" }

services:
  api:
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./postgres-ca.crt:/etc/caveman/postgres-ca.crt:ro

  worker:
    restart: unless-stopped
    logging: *logging
    security_opt: !reset []
    volumes:
      - ./postgres-ca.crt:/etc/caveman/postgres-ca.crt:ro
    environment:
      CAVEMAN_DATA_DIR: /data
      CAVEMAN_SANDBOX_BACKEND: e2b

  web:
    restart: unless-stopped
    logging: *logging
    ports: !reset []
    expose: ["3000"]
    volumes:
      - ./postgres-ca.crt:/etc/caveman/postgres-ca.crt:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on: [web]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CAVEMAN_DOMAIN: ${CAVEMAN_DOMAIN:?set CAVEMAN_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Optional: ships the container logs above to Grafana Cloud Logs (or any
  # Loki). Off unless .env has COMPOSE_PROFILES=logs and the three GRAFANA_LOKI_*
  # values (docs/DEPLOY_DIGITALOCEAN.md, "Logs"). It reads Docker's log files
  # through a read-only mount and is not given the Docker socket.
  alloy:
    profiles: [logs]
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    logging: *logging
    user: root  # Docker's log files are readable by root only
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["run", "--storage.path=/var/lib/alloy/data", "--disable-reporting", "/etc/alloy/config.alloy"]
    environment:
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN:-}
    volumes:
      - ./logs/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy/data

volumes:
  caveman-data:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/caveman-data }
  caddy-data:
  caddy-config:
  alloy-data:
