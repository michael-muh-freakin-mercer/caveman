name: I have an idea
description: Something Caveman should do, but doesn't (yet).
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what's in the way today? Start with the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like to happen. Sketches, mockups and napkin drawings all welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you thought about
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the [roadmap](https://github.com/michael-muh-freakin-mercer/caveman/blob/main/docs/ROADMAP.md) and existing issues.
          required: true
