version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned so the E2E browser matches the preinstalled Chromium; bump deliberately.
      - dependency-name: "@playwright/test"
      # eslint-config-next's bundled lint plugins don't support these majors yet
      # (typescript-eslint rejects TS 7; eslint-plugin-react crashes on ESLint 10).
      # Lift once eslint-config-next supports them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
