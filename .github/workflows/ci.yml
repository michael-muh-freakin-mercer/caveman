name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: backend suite
    # Pinned rather than ubuntu-latest: the label migrates to Ubuntu 26 on
    # 2026-10-19, and a runner-image change should be a deliberate commit here,
    # not a red build with no code change behind it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the isolation backend and the system interpreter
        # Walter's sandbox fails closed without bubblewrap and libseccomp, so the
        # sandbox tests cannot run at all on a runner that lacks them.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap libseccomp2 util-linux python3-venv

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which breaks bubblewrap. The suite below is what proves whether this
        # worked; do not let it fail silently.
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Report the host layout
        run: |
          python3 -VV
          ls -l /usr/bin/bwrap /usr/bin/prlimit
          python3 -c "import ctypes; ctypes.CDLL('libseccomp.so.2'); print('libseccomp resolves')"
          ls -ld /lib /lib64 /usr/lib64 || true

      - uses: actions/setup-node@v5
        with:
          # The sandboxed Node toolchain needs Node 22+ (type stripping, in-process test isolation).
          node-version: 22

      - name: Install Caveman (API, worker and orchestration core)
        # Deliberately the distribution interpreter, not a toolcache one. The
        # sandbox binds /usr into an environment-cleared namespace, so the
        # interpreter has to be self-contained under that tree; toolcache builds
        # need LD_LIBRARY_PATH to find their own libpython, which a cleared
        # environment cannot supply.
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[test]'

      - name: Offline suite
        run: .venv/bin/python -m pytest -q

      - name: Offline evaluation scenarios
        run: .venv/bin/python evals/runner.py

  web:
    name: web (typecheck, lint, unit, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm test
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BETTER_AUTH_SECRET: ci-build-only-secret-0123456789abcdef
          CAVEMAN_AUTH_AUTO_MIGRATE: "0"
        run: npm run build

  e2e:
    name: end-to-end journeys
    runs-on: ubuntu-24.04
    needs: [suite, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the isolation backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap libseccomp2 util-linux python3-venv
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Caveman
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[test]'
      - name: Install web dependencies and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run journeys
        working-directory: web
        env:
          CI: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7